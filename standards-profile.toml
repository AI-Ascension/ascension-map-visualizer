schema_version = 1
profile_id = "rust-browser"
repository = "AI-Ascension/ascension-map-visualizer"
owner = "ARCH"
source_bundle = "AI-Ascension/.github"
source_commit = "eed9921b5c5d5c41380655bded84f9e2d0aab599"
source_digest = "sha256:01a44552f0f717723e4e3e7f4e15f9f3ff632c3550498b63c5bf808265831936"
distribution = "local"
scopes = [
    "rust",
    "javascript",
    "json",
    "contracts",
]

[checks]
fast = [
    "git-diff-check",
    "standards-validate",
    "cargo-metadata",
    "cargo-fmt",
]
required = [
    "cargo-clippy",
    "cargo-test",
    "contracts-check",
    "browser-check",
    "dependency-advisories",
]
extended = [
    "release-package",
]

[checks.commands.browser-check]
command = "npm run test:browser"
target = "."

[checks.commands.cargo-clippy]
command = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"
target = "."

[checks.commands.cargo-fmt]
command = "cargo fmt --all --check"
target = "."

[checks.commands.cargo-metadata]
command = "cargo metadata --locked --no-deps --format-version 1"
target = "."

[checks.commands.cargo-test]
command = "cargo test --workspace --all-targets --all-features --locked"
target = "."

[checks.commands.contracts-check]
command = "node tools/contracts.mjs"
target = "."

[checks.commands.dependency-advisories]
command = "cargo deny check"
target = "."

[checks.commands.git-diff-check]
command = "git diff --check"
target = "."

[checks.commands.release-package]
command = "node tools/build-release.mjs"
target = "."

[checks.commands.standards-validate]
command = "cargo +1.97.1 run --locked --manifest-path standards/tools/standards-sync/Cargo.toml -- validate --root ."
target = "."

[evidence]
runtime = "unverified"
deployment = "unverified"
provider = "unverified"

[exceptions]
file = ""
status = "none"
