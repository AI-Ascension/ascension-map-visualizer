[package]
name = "map-visualizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Deterministic read-only presentation of validated permitted map bundles"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
resvg.workspace = true
cap-std.workspace = true
jsonschema = { version = "=0.52.1", default-features = false }
sts2-protocol = { git = "https://github.com/AI-Ascension/sts2-protocol.git", rev = "d9ffb190ad8990e15f43d7992581dcb2d60b1971", version = "0.0.0" }
ctrlc = { version = "=3.5.2", features = ["termination"] }

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
tempfile = "=3.27.0"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }
